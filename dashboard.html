<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudySquad — дашборд</title>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Manrope:wght@400;500;600;700&family=Oranienbaum&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #07080c; --surface: #10131b; --surface2: #171c27; --border: rgba(166,177,204,0.32);
      --accent: #b7d8d4; --accent2: #b8abce; --text: #f5f7ff; --muted: #a2a9bc;
      --radius: 16px; --success: #4ade80; --warning: #fbbf24; --error: #f87171;
      --font-display: 'Oranienbaum', serif; --font-ui: 'Manrope', sans-serif; --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); }

    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 60% 40% at 10% 0%, rgba(183,216,212,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse 40% 30% at 90% 100%, rgba(184,171,206,0.06) 0%, transparent 50%),
                  radial-gradient(ellipse 30% 20% at 50% 50%, rgba(183,216,212,0.03) 0%, transparent 60%),
                  var(--bg);
      pointer-events: none;
    }

    .layout { position: relative; z-index: 1; display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar { border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .logo { font-family: var(--font-display); font-size: 16px; font-weight: 700; padding: 8px 12px 20px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(166,177,204,0.10); margin-bottom: 8px; }
    .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all 0.2s ease; text-decoration: none; }
    .nav-item:hover { background: rgba(183,216,212,0.06); color: var(--text); }
    .nav-item.active { background: rgba(183,216,212,0.10); color: var(--accent); }
    .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
    .sidebar-bottom { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
    .user-block { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .user-info { flex: 1; min-width: 0; }
    .user-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-email { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .logout-btn { font-size: 12px; color: var(--muted); cursor: pointer; padding: 4px 12px; border-radius: 6px; background: none; border: none; font-family: inherit; }
    .logout-btn:hover { color: var(--error); }

    /* ── Main ── */
    .main { padding: 36px 44px; display: flex; flex-direction: column; gap: 32px; }
    .page-header { display: flex; align-items: center; justify-content: space-between; }
    .page-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .btn-primary { display: flex; align-items: center; gap: 8px; padding: 10px 22px; background: var(--accent); color: white; border: none; border-radius: 10px; font-family: var(--font-ui); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .btn-primary:hover { background: #8fbeb9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(183,216,212,0.3); }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .stat-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
    .stat-label { font-family: var(--font-mono); letter-spacing: 0.04em; font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; }
    .stat-value { font-family: var(--font-display); font-size: 32px; font-weight: 700; background: linear-gradient(135deg, var(--text), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .stat-sub { font-size: 12px; color: var(--muted); }

    .section-title { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }
    .transcription-list { display: flex; flex-direction: column; gap: 10px; }
    .transcription-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: all 0.2s ease; text-decoration: none; color: inherit; }
    .transcription-card:hover { border-color: rgba(183,216,212,0.2); background: var(--surface2); transform: translateX(4px); }
    .tc-icon { width: 44px; height: 44px; border-radius: 12px; background: rgba(183,216,212,0.08); border: 1px solid rgba(183,216,212,0.08); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .tc-info { flex: 1; min-width: 0; }
    .tc-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tc-meta { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .tc-status { font-family: var(--font-mono); letter-spacing: 0.02em; padding: 4px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
    .status-done { background: rgba(74,222,128,0.1); color: var(--success); }
    .status-pending { background: rgba(251,191,36,0.1); color: var(--warning); }
    .status-processing { background: rgba(183,216,212,0.10); color: var(--accent); }
    .status-error { background: rgba(248,113,113,0.1); color: var(--error); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 12px; }
    .empty-state .empty-icon { font-size: 48px; opacity: 0.5; }
    .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text); }
    .empty-state p { font-size: 14px; }

    .loading-skeleton { background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .page-header { animation: fadeIn 0.4s ease both; }
    .stats { animation: fadeIn 0.4s ease both; animation-delay: 0.1s; }
    .transcription-list { animation: fadeIn 0.4s ease both; animation-delay: 0.2s; }

    /* ── Mobile bottom nav ── */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(19,19,26,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding: 8px 0 max(8px, env(safe-area-inset-bottom));
    }

    .mobile-nav-inner { display: flex; justify-content: space-around; align-items: center; }

    .mobile-nav-item {
      font-family: var(--font-mono);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 6px 16px; border-radius: 10px;
      font-size: 10px; font-weight: 600; color: var(--muted);
      letter-spacing: 0.02em;
      text-decoration: none; transition: color 0.15s;
      min-width: 60px;
    }
    .mobile-nav-item .mnav-icon { font-size: 20px; line-height: 1; }
    .mobile-nav-item.active { color: var(--accent); }
    .mobile-nav-item:hover { color: var(--text); }

    /* ── Mobile header ── */
    .mobile-header {
      display: none;
      position: sticky; top: 0; z-index: 50;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      align-items: center;
      justify-content: space-between;
    }
    .mobile-logo { font-family: var(--font-display); font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .mobile-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; cursor: pointer; }

    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .mobile-nav { display: block; }
      .mobile-header { display: flex; }
      .main { padding: 20px 16px 90px; gap: 24px; }
      .page-header { flex-wrap: wrap; gap: 12px; }
      .page-title { font-size: 20px; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-card { padding: 14px 12px; }
      .stat-label { font-size: 9px; letter-spacing: 0.06em; }
      .stat-value { font-size: 22px; }
      .stat-sub { font-size: 11px; }
      .transcription-card { padding: 14px; }
      .tc-icon { width: 38px; height: 38px; border-radius: 10px; font-size: 18px; }
      .tc-meta { gap: 8px; }
      .btn-primary { font-size: 13px; padding: 8px 16px; }
    }

    @media (max-width: 380px) {
      .stats { grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
      .stat-card { padding: 12px 10px; }
      .stat-label { font-size: 8px; }
      .stat-value { font-size: 20px; }
    }
  </style>
  <link rel="stylesheet" href="theme-3-1.css" />

</head>
<body>
  <div class="bg"></div>

  <!-- Mobile header -->
  <div class="mobile-header">
    <div class="mobile-logo">
      <div class="logo-dot"></div>
      StudySquad
    </div>
    <div style="width:32px;"></div>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="logo"><div class="logo-dot"></div>StudySquad</div>
      <a href="dashboard.html" class="nav-item active"><span class="icon">🏠</span> Главная</a>
      <a href="upload.html" class="nav-item"><span class="icon">🎙️</span> Загрузить лекцию</a>
      <a href="#" class="nav-item nav-disabled" aria-disabled="true" tabindex="-1"><span class="icon">📚</span> Предметы</a>
      <a href="#" class="nav-item nav-disabled" aria-disabled="true" tabindex="-1"><span class="icon">👥</span> Моя группа</a>
      <a href="quizzes.html" class="nav-item"><span class="icon">🧠</span> Квизы</a>
    </aside>

    <main class="main">
      <div class="page-header">
        <h1 class="page-title">Мои транскрипции</h1>
        <a href="upload.html" class="btn-primary">+ Загрузить</a>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">Всего лекций</div>
          <div class="stat-value" id="statTotal">—</div>
          <div class="stat-sub">за всё время</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Готово</div>
          <div class="stat-value" id="statDone">—</div>
          <div class="stat-sub">транскрипций</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Квизов</div>
          <div class="stat-value" id="statQuizzes">—</div>
          <div class="stat-sub">создано</div>
        </div>
      </div>

      <div>
        <div class="section-title" style="margin-bottom: 16px;">Последние загрузки</div>
        <div class="transcription-list" id="list">
          <div style="height: 80px; border-radius: 16px;" class="loading-skeleton"></div>
          <div style="height: 80px; border-radius: 16px;" class="loading-skeleton"></div>
          <div style="height: 80px; border-radius: 16px;" class="loading-skeleton"></div>
        </div>
      </div>
    </main>
  </div>

  <!-- Mobile bottom nav -->
  <nav class="mobile-nav">
    <div class="mobile-nav-inner">
      <a href="dashboard.html" class="mobile-nav-item active">
        <span class="mnav-icon">🏠</span>
        <span>Главная</span>
      </a>
      <a href="upload.html" class="mobile-nav-item">
        <span class="mnav-icon">🎙️</span>
        <span>Загрузить</span>
      </a>
      <a href="quizzes.html" class="mobile-nav-item">
        <span class="mnav-icon">🧠</span>
        <span>Квизы</span>
      </a>
    </div>
  </nav>

  <script>
    const CONFIG = { API_URL: 'https://d5dl1rb13ng0aicdmdk1.hsvi2zuh.apigw.yandexcloud.net' }
    let userId = localStorage.getItem('user_id')
    if (!userId) { userId = crypto.randomUUID(); localStorage.setItem('user_id', userId) }

    async function loadTranscriptions() {
      try {
        const res = await fetch(`${CONFIG.API_URL}/transcriptions`, { headers: { 'X-User-Id': userId } })
        const data = await res.json()
        renderList(data.transcriptions || [])
        renderStats(data.transcriptions || [])
      } catch (e) {
        document.getElementById('list').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Не удалось загрузить</h3><p>Проверь соединение</p></div>`
      }
    }

    function renderStats(items) {
      document.getElementById('statTotal').textContent = items.length
      document.getElementById('statDone').textContent = items.filter(i => i.status === 'done').length
      document.getElementById('statQuizzes').textContent = items.reduce((acc, i) => acc + (i.quiz_count || 0), 0)
    }

    function renderList(items) {
      const list = document.getElementById('list')
      if (!items.length) {
        list.innerHTML = `<div class="empty-state"><div class="empty-icon">🎙️</div><h3>Пока нет лекций</h3><p>Загрузи первую запись</p></div>`
        return
      }
      const statusMap = { done: ['status-done', 'Готово'], pending: ['status-pending', 'Ожидает'], processing: ['status-processing', 'Обработка...'], error: ['status-error', 'Ошибка'] }
      list.innerHTML = items.map(item => {
        const [cls, label] = statusMap[item.status] || ['status-pending', 'Ожидает']
        const date = new Date(item.created_at).toLocaleDateString('ru-RU')
        return `<a href="transcription.html?id=${item.id}" class="transcription-card">
          <div class="tc-icon">🎙️</div>
          <div class="tc-info">
            <div class="tc-title">${item.title}</div>
            <div class="tc-meta"><span>${item.subject_name || 'Без предмета'}</span><span>${date}</span></div>
          </div>
          <div class="tc-status ${cls}">${label}</div>
        </a>`
      }).join('')
    }

    loadTranscriptions()
  </script>
</body>
</html>
